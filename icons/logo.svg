<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dog-Ear">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b3f34"/>
      <stop offset="1" stop-color="#1b1713"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#e9b949" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e9b949" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9dfc9"/>
      <stop offset=".12" stop-color="#fbf5e8"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6cf6a"/>
      <stop offset="1" stop-color="#c4822a"/>
    </linearGradient>
  </defs>

  <!-- warm wooden-desk tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- page shadow -->
  <path d="M158 104 H300 L396 200 V414 Q396 438 372 438 H158 Q134 438 134 414 V128 Q134 104 158 104 Z" fill="#000" opacity=".35"/>

  <!-- the page, top-right corner folded away -->
  <path d="M150 88 H288 L384 184 V402 Q384 424 362 424 H150 Q128 424 128 402 V110 Q128 88 150 88 Z" fill="url(#paper)"/>

  <!-- lines of text, one swiped with a highlighter -->
  <g fill="#c9bca4">
    <rect x="164" y="236" width="150" height="16" rx="8"/>
    <rect x="164" y="276" width="188" height="16" rx="8"/>
    <rect x="164" y="316" width="168" height="16" rx="8"/>
    <rect x="164" y="356" width="112" height="16" rx="8"/>
  </g>
  <rect x="154" y="268" width="210" height="32" rx="9" fill="#ffd60a" opacity=".6" transform="rotate(-2 259 284)"/>

  <!-- the dog-ear: folded corner shaped like a floppy golden ear -->
  <path d="M288 88 L384 184 C352 186 322 198 304 220 C294 232 280 226 282 210 C288 168 290 126 288 88 Z" fill="#000" opacity=".22" transform="translate(-6 10)"/>
  <path d="M288 88 L384 184 C352 186 322 198 304 220 C294 232 280 226 282 210 C288 168 290 126 288 88 Z" fill="url(#ear)"/>
  <path d="M288 88 L384 184" stroke="#fff3d0" stroke-width="4" stroke-linecap="round" opacity=".7"/>
</svg>
